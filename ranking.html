<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FØX - Ranking Global</title>
    <style>
        /* Reset e Variáveis de Cores */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg-color: #0b0c16;
            --card-bg: #131424;
            --text-color: #ffffff;
            --text-muted: #7b7d93;
            --primary-gradient: linear-gradient(90deg, #a855f7, #ec4899);
            --border-color: #1f223f;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Navbar --- */
        .navbar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 24px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-icon {
            background: var(--primary-gradient);
            padding: 6px;
            border-radius: 8px;
            -webkit-text-fill-color: white;
            font-size: 16px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .nav-links a.active, .nav-links a:hover {
            color: #ec4899;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .search-box {
            background-color: #16192b;
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .btn-entrar {
            background: var(--primary-gradient);
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        /* --- Conteúdo Principal --- */
        .container {
            width: 100%;
            max-width: 1000px;
            padding: 40px 20px;
        }

        .title-section {
            margin-bottom: 30px;
        }

        .title-section h1 {
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title-section h1 span {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title-section p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 5px;
        }

        /* --- Cards de Pódio --- */
        .podium-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .podium-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            transition: transform 0.3s;
        }

        /* Destaque para o 1º Lugar (Borda Roxa) */
        .podium-card.first-place {
            border: 1px solid #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.1);
        }

        .trophy-icon {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .first-place .trophy-icon { color: #ffd700; }
        .second-place .trophy-icon { color: #c0c0c0; }
        .third-place .trophy-icon { color: #cd7f32; }

        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            background-color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px; /* Representando os bonecos em pixel art */
        }

        .player-name {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .player-stats {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 4px;
        }

        /* --- Tabela de Classificação --- */
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }

        .leaderboard-table th, .leaderboard-table td {
            padding: 15px 20px;
            text-align: left;
            font-size: 14px;
        }

        .leaderboard-table th {
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
        }

        .leaderboard-table tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .leaderboard-table tr:last-child {
            border-bottom: none;
        }

        .col-center { text-align: center; width: 60px; }
        .col-right { text-align: right; }

        .table-player {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
        }

        .table-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .row-trophy {
            margin-left: 8px;
            font-size: 14px;
        }

        .points-val {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <span class="logo-icon">🎮</span> FØX
        </div>
        <nav class="nav-links">
           <a href="index.html">Início</a>
<a href="jogos.html">Jogos</a>
<a href="ranking.html">Ranking</a>
<a href="noticias.html">Notícias</a>
<a href="comunidade.html">Comunidade</a>
        </nav>
        <div class="nav-right">
            <input type="text" class="search-box" placeholder="Buscar jogos...">
            <button class="btn-entrar">Entrar</button>
        </div>
    </header>

    <main class="container">
        
        <section class="title-section">
            <h1>📈 <span>Ranking</span> Global</h1>
            <p>Top jogadores da plataforma FØX</p>
        </section>

        <section class="podium-container">
            
            <div class="podium-card first-place">
                <div class="trophy-icon">👑</div>
                <div class="avatar">👨🏾‍🎤</div>
                <div class="player-name">Beatriz</div>
                <div class="player-stats">100 pts</div>
                <div class="player-stats">👥 0 vitórias</div>
            </div>

            <div class="podium-card second-place">
                <div class="trophy-icon">🥈</div>
                <div class="avatar">👩🏻‍🦰</div>
                <div class="player-name">Esperança</div>
                <div class="player-stats">100 pts</div>
                <div class="player-stats">👥 0 vitórias</div>
            </div>

            <div class="podium-card third-place">
                <div class="trophy-icon">🥉</div>
                <div class="avatar">👩🏽‍💼</div>
                <div class="player-name">Lua</div>
                <div class="player-stats">100 pts</div>
                <div class="player-stats">👥 0 vitórias</div>
            </div>

        </section>

        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th class="col-center">#</th>
                    <th>Jogador</th>
                    <th class="col-right">Pontos</th>
                    <th class="col-right">Vitórias</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="col-center" style="color: var(--text-muted);">1</td>
                    <td>
                        <div class="table-player">
                            <div class="table-avatar">👨🏾‍🎤</div>
                            Beatriz <span class="row-trophy" style="color: #ffd700;">👑</span>
                        </div>
                    </td>
                    <td class="col-right points-val">100</td>
                    <td class="col-right" style="color: var(--text-muted);">0</td>
                </tr>
                <tr>
                    <td class="col-center" style="color: var(--text-muted);">2</td>
                    <td>
                        <div class="table-player">
                            <div class="table-avatar">👩🏻‍🦰</div>
                            Esperança <span class="row-trophy" style="color: #c0c0c0;">🥈</span>
                        </div>
                    </td>
                    <td class="col-right points-val">100</td>
                    <td class="col-right" style="color: var(--text-muted);">0</td>
                </tr>
                <tr>
                    <td class="col-center" style="color: var(--text-muted);">3</td>
                    <td>
                        <div class="table-player">
                            <div class="table-avatar">👩🏽‍💼</div>
                            Lua <span class="row-trophy" style="color: #cd7f32;">🥉</span>
                        </div>
                    </td>
                    <td class="col-right points-val">100</td>
                    <td class="col-right" style="color: var(--text-muted);">0</td>
                </tr>
            </tbody>
        </table>

    </main>

</body>
</html>
