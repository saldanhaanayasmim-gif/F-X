<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FØX - Comunidade</title>
    <style>
        /* Reset e Variáveis de Cores (Padrão FØX) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg-color: #0b0c16;
            --card-bg: #131424;
            --text-color: #ffffff;
            --text-muted: #7b7d93;
            --primary-gradient: linear-gradient(90deg, #a855f7, #ec4899);
            --border-color: #1f223f;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Navbar --- */
        .navbar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 24px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-icon {
            background: var(--primary-gradient);
            padding: 6px;
            border-radius: 8px;
            -webkit-text-fill-color: white;
            font-size: 16px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .nav-links a.active, .nav-links a:hover {
            color: #ec4899;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .search-box {
            background-color: #16192b;
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .btn-entrar {
            background: var(--primary-gradient);
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        /* --- Conteúdo Principal --- */
        .container {
            width: 100%;
            max-width: 1000px;
            padding: 40px 20px;
        }

        .title-section {
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .title-icon {
            background-color: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 10px;
            border-radius: 10px;
            font-size: 20px;
            line-height: 1;
            color: #3b82f6;
        }

        .title-section h1 {
            font-size: 28px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }

        .title-section p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 3px;
        }

        /* --- Botões de Ação Secundários --- */
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn-secondary {
            background-color: transparent;
            font-size: 13px;
            font-weight: bold;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.3s;
        }

        .btn-blue {
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #3b82f6;
        }
        .btn-blue:hover { background-color: rgba(59, 130, 246, 0.05); }

        .btn-purple {
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #a855f7;
        }
        .btn-purple:hover { background-color: rgba(168, 85, 247, 0.05); }

        /* --- Cards de Métricas (Grid de 3 Colunas) --- */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 25px;
            text-align: center;
        }

        .metric-icon {
            font-size: 18px;
            margin-bottom: 10px;
        }
        .metric-card:nth-child(1) .metric-icon { color: #3b82f6; }
        .metric-card:nth-child(2) .metric-icon { color: #a855f7; }
        .metric-card:nth-child(3) .metric-icon { color: #ec4899; }

        .metric-value {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .metric-label {
            color: var(--text-muted);
            font-size: 12px;
        }

        /* --- Caixa de Alerta de Postagem --- */
        .cta-post-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .cta-text {
            color: var(--text-muted);
            font-size: 14px;
        }

        .btn-inline-entrar {
            background: var(--primary-gradient);
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* --- Feed / Área de Post --- */
        .post-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .post-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-weight: bold;
            font-size: 14px;
        }

        .post-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 2px;
        }

        .post-time {
            color: var(--text-muted);
            font-size: 12px;
        }

        .tag-geral {
            background-color: rgba(168, 85, 247, 0.2);
            color: #c084fc;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .post-content {
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* --- Rodapé do Post (Ações) --- */
        .post-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding-top: 15px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .interactions {
            display: flex;
            gap: 15px;
        }

        .interaction-item {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        
        .interaction-item:hover {
            color: #ffffff;
        }

        .share-item {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .share-item:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <span class="logo-icon">🎮</span> FØX
        </div>
        <nav class="nav-links">
            <a href="index.html">Início</a>
<a href="jogos.html">Jogos</a>
<a href="ranking.html">Ranking</a>
<a href="noticias.html">Notícias</a>
<a href="comunidade.html">Comunidade</a>
        </nav>
        <div class="nav-right">
            <input type="text" class="search-box" placeholder="Buscar jogos...">
            <button class="btn-entrar">Entrar</button>
        </div>
    </header>

    <main class="container">
        
        <section class="title-section">
            <div class="title-icon">👥</div>
            <div>
                <h1>Comunidade</h1>
                <p>Conecte-se com jogadores do mundo inteiro</p>
            </div>
        </section>

        <div class="action-buttons">
            <button class="btn-secondary btn-blue">💬 Chat ao vivo</button>
            <button class="btn-secondary btn-purple">✉️ Mensagens privadas</button>
        </div>

        <section class="metrics-grid">
            <div class="metric-card">
                <div class="metric-icon">👥</div>
                <div class="metric-value">48.2K</div>
                <div class="metric-label">Membros ativos</div>
            </div>
            <div class="metric-card">
                <div class="metric-icon">💬</div>
                <div class="metric-value">1.3K</div>
                <div class="metric-label">Posts hoje</div>
            </div>
            <div class="metric-card">
                <div class="metric-icon">⚡</div>
                <div class="metric-value">6.7K</div>
                <div class="metric-label">Online agora</div>
            </div>
        </section>

        <div class="cta-post-box">
            <span class="cta-text">Entra na tua conta para postar, curtir e comentar.</span>
            <button class="btn-inline-entrar">➔ Entrar</button>
        </div>

        <section class="feed-container">
            <div class="post-card">
                <div class="post-header">
                    <div class="post-avatar">👩🏽‍💼</div>
                    <div class="user-info">
                        <span class="user-name">Lua</span>
                        <div class="post-meta">
                            <span class="post-time">1h atrás</span>
                            <span class="tag-geral">Geral</span>
                        </div>
                    </div>
                </div>
                <div class="post-content">
                    Olá galerinha bom dia!
                </div>
                <div class="post-actions">
                    <div class="interactions">
                        <div class="interaction-item">🤍 1</div>
                        <div class="interaction-item">💬 0 ⌃</div>
                    </div>
                    <div class="share-item">🔗 Partilhar</div>
                </div>
            </div>
        </section>

    </main>

</body>
</html>
